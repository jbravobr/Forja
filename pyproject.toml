[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forja"
version = "0.0.0"
description = "Drives coding-agent CLIs and gates their output with deterministic checks."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.7",
    "rich>=15.0.0",
    "ruff>=0.17.0",
    "lizard>=1.24.1",
    "textual>=8.2.8",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
forja = "forja.cli.main:main"

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "pytest-xdist>=3.8.0",
    "coverage>=7.6",
    "pytest-timeout>=2.3",
]
capturas = [
    "pywinpty",
    "pyte",
    "pillow",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forja"]

[tool.coverage.run]
source = ["src/forja"]
dynamic_context = "test_function"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end runs that start many processes; run them before every release",
    "tools: needs an external tool (gitleaks); skipped when it is not installed",
    "integration: real git or real processes; left out when FORJA_FAST=1 (mutation testing)",
    "live: calls a real agent CLI with the user's own login; only runs with FORJA_LIVE=1",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "scripts/medicao/repos",  # the experiment's repositories: data, not code
    "scripts/medicao/defeitos",  # repositories with planted defects and deliberately bad tests
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# the sample repositories of the measurement (each with its own `core.py`) are data, not Forja's code
exclude = ["scripts/medicao/defeitos/", "scripts/medicao/repos/"]

[tool.forja.mutation]
# Tests that fail on Linux today: the gate needs a green run to start from.
deselect = [
    "tests/core/gitguard/test_snapshot.py::test_a_fetch_that_moves_remote_tracking_refs_is_a_change",
    "tests/core/locking/test_index_locks.py::test_the_real_process_list_includes_this_process_and_no_invented_names",
    "tests/core/redaction/test_secrets.py::test_forjas_own_source_is_clean",
    "tests/core/locking/test_repository.py::test_the_repository_id_is_short_stable_and_shared_by_every_worktree",
]
